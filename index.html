const q=document.querySelector("#q");
const results=document.querySelector("#results");
const searchCard=document.querySelector("#searchCard");
const quiz=document.querySelector("#quiz");
const norm=s=>String(s).toLowerCase().normalize("NFKC");
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML;};

q.addEventListener("input",()=>{
 const x=norm(q.value.trim());
 results.innerHTML="";
 if(!x)return;
 const matches=songs.filter(s=>norm(s.title+" "+s.artist).includes(x)).slice(0,40);
 matches.forEach(s=>{
   const d=document.createElement("div");
   d.className="result";
   d.innerHTML=`<div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div>`;
   d.onclick=()=>selectSong(s);
   results.appendChild(d);
 });
 if(!matches.length) results.innerHTML='<div class="result">該当する曲がありません</div>';
});

function selectSong(s){
 searchCard.style.display="none";
 quiz.style.display="block";
 document.querySelector("#songTitle").textContent=s.title;
 document.querySelector("#songArtist").textContent=s.artist;
 document.querySelector("#person").textContent=s.person;
 document.querySelector("#comment").textContent=s.comment;
 document.querySelector("#commentBox").style.display=(s.person==="ダミー" && s.comment) ? "block":"none";
 document.querySelector("#answer").style.display="none";
 document.querySelector("#reveal").style.display="block";
 window.scrollTo(0,0);
}
document.querySelector("#reveal").onclick=()=>{
 document.querySelector("#answer").style.display="block";
 document.querySelector("#reveal").style.display="none";
};
document.querySelector("#back").onclick=()=>{
 quiz.style.display="none";
 searchCard.style.display="block";
 q.value="";
 results.innerHTML="";
 q.focus();
 window.scrollTo(0,0);
};
</script>
